<app-file-conversion-ui title="HTML to PNG" description="Convert HTML files or website URLs to PNG image"
    sourceIcon="fas fa-file-code" targetIcon="fas fa-file-image" convertButtonText="Convert"
    [isConverting]="isConverting" [conversionStatus]="conversionStatus" [uploadProgress]="uploadProgress"
    [conversionResult]="conversionResult" [selectedFile]="selectedFile" (fileSelected)="onFileSelected($event)" (convert)="convert()"
    (reset)="reset()" (download)="saveFile()" [disableFileUpload]="false"
    allowedExtensions=".html" allowedExtensionsText="Supports .html files">
    <!-- Custom Options -->
    <div class="form-group" style="grid-column: 1 / -1;">
        <label>Output Filename</label>
        <div class="input-wrapper">
            <i class="fas fa-file-image"></i>
            <input type="text" [(ngModel)]="outputFilename" placeholder="converted">
        </div>
        <small>Extension is added automatically</small>
    </div>
</app-file-conversion-ui>
