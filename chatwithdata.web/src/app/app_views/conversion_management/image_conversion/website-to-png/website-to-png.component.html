<app-file-conversion-ui title="Website to PNG" description="Convert website URLs to PNG image"
    sourceIcon="fas fa-globe" targetIcon="fas fa-file-image" convertButtonText="Convert"
    [isConverting]="isConverting" [conversionStatus]="conversionStatus" [uploadProgress]="uploadProgress"
    [conversionResult]="conversionResult" (convert)="convert()"
    (reset)="reset()" (download)="saveFile()" [disableFileUpload]="true">
    <!-- Custom Options -->
    <div class="form-group" style="grid-column: 1 / -1;">
        <label>Website URL</label>
        <div class="input-wrapper">
            <i class="fas fa-link"></i>
            <input type="text" [(ngModel)]="url" placeholder="https://example.com">
        </div>
    </div>
    <div class="form-group" style="grid-column: 1 / -1;">
        <label>Output Filename</label>
        <div class="input-wrapper">
            <i class="fas fa-file-image"></i>
            <input type="text" [(ngModel)]="outputFilename" placeholder="converted">
        </div>
        <small>Extension is added automatically</small>
    </div>
</app-file-conversion-ui>
