<app-file-conversion-ui title="Markdown to LaTeX" description="Convert Markdown to LaTeX academic format"
    sourceIcon="fab fa-markdown" targetIcon="fas fa-square-root-alt" allowedExtensions=".md"
    allowedExtensionsText="Supports .md files" convertButtonText="Convert" [selectedFile]="selectedFile"
    [isConverting]="isConverting" [conversionStatus]="conversionStatus" [conversionResult]="conversionResult"
    (fileSelected)="onFileSelected($event)" (convert)="convert()" (reset)="reset()" (download)="saveFile()">

    <div class="form-group" style="grid-column: 1 / -1;">
        <label>Output Filename</label>
        <div class="input-wrapper">
            <i class="fas fa-square-root-alt"></i>
            <input type="text" [(ngModel)]="outputFilename" placeholder="converted">
        </div>
        <small>Extension is added automatically</small>
    </div>
</app-file-conversion-ui>
