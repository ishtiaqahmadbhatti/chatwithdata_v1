<app-file-conversion-ui title="Word to Markdown" description="Convert Microsoft Word documents to Markdown"
    sourceIcon="fas fa-file-word" targetIcon="fab fa-markdown" allowedExtensions=".docx,.doc"
    allowedExtensionsText="Supports .docx, .doc files" convertButtonText="Convert" [selectedFile]="selectedFile"
    [isConverting]="isConverting" [conversionStatus]="conversionStatus" [conversionResult]="conversionResult"
    (fileSelected)="onFileSelected($event)" (convert)="convert()" (reset)="reset()" (download)="saveFile()">

    <div class="form-group" style="grid-column: 1 / -1;">
        <label>Output Filename</label>
        <div class="input-wrapper">
            <i class="fab fa-markdown"></i>
            <input type="text" [(ngModel)]="outputFilename" placeholder="converted">
        </div>
        <small>Extension is added automatically</small>
    </div>
</app-file-conversion-ui>
